name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    uses: spikyuni/.github/.github/workflows/pnpm-deploy-pages.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      build-script: pnpm web build
      path: apps/website/dist
